[package]
name = "nortinstall_core"
version = "0.1.0"
edition = "2021"
description = "Rust core for NortInstall: IPA parsing and (later) signing helpers, exposed via FFI"

[lib]
# staticlib — для линковки в iOS-приложение, rlib — чтобы тесты шли на любой ОС
crate-type = ["staticlib", "rlib"]

[dependencies]
libc = "0.2"
plist = "1"
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
