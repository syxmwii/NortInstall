<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Начать установку — NortInstall</title>
<link rel="icon" type="image/png" href="favicon-192.png">
<style>
  :root {
    --bg: #0b0d12; --card: #141822; --border: #232a3a;
    --text: #e8ebf2; --muted: #8b93a7; --accent: #26d83c; --on-accent: #04140a;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 24px 20px 60px; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 12px 0 26px; }
  .logo { font-weight: 700; font-size: 18px; }
  .logo span { color: var(--accent); }
  .back { color: var(--muted); text-decoration: none; font-size: 15px; }
  .back:hover { color: var(--text); }

  /* Прогресс */
  .progress { display: flex; gap: 8px; margin-bottom: 10px; }
  .seg { flex: 1; height: 6px; border-radius: 99px; background: var(--border); overflow: hidden; }
  .seg i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px;
           transition: width .45s cubic-bezier(.2,.7,.3,1); }
  .seg.done i, .seg.current i { width: 100%; }
  .seg.current i { opacity: .55; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 1; } }
  .stepno { color: var(--muted); font-size: 14px; margin-bottom: 18px; }

  /* Карточка шага и её анимация */
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 20px;
    padding: 26px; box-shadow: 0 20px 60px rgba(0,0,0,.4);
  }
  .card.enter { animation: enter .4s cubic-bezier(.2,.7,.3,1); }
  .card.enter-back { animation: enter-back .4s cubic-bezier(.2,.7,.3,1); }
  @keyframes enter { from { opacity: 0; transform: translateX(36px); } to { opacity: 1; transform: none; } }
  @keyframes enter-back { from { opacity: 0; transform: translateX(-36px); } to { opacity: 1; transform: none; } }

  .emoji { font-size: 40px; margin-bottom: 10px; display: inline-block; animation: pop .45s cubic-bezier(.2,.9,.3,1.4); }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  h1 { font-size: 24px; letter-spacing: -.01em; margin-bottom: 10px; }
  .text { color: var(--muted); font-size: 15px; margin-bottom: 16px; }
  .text b { color: var(--text); }
  .text ol { padding-left: 20px; }
  .text li { margin: 6px 0; }

  .btn {
    display: block; width: 100%; text-align: center; text-decoration: none;
    background: var(--accent); color: var(--on-accent); border: 0;
    font-weight: 700; font-size: 16px; padding: 14px; border-radius: 14px;
    cursor: pointer; margin-top: 10px;
    transition: box-shadow .25s ease, transform .15s ease, background .2s ease;
  }
  .btn:hover { box-shadow: 0 6px 24px rgba(38,216,60,.35); }
  .btn:active { transform: scale(.97); }
  .btn.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); font-weight: 500; }
  .btn.ghost:hover { box-shadow: none; border-color: var(--accent); }
  .btn:disabled { opacity: .35; pointer-events: none; }

  select {
    width: 100%; background: #0e1118; color: var(--text); border: 1px solid var(--border);
    border-radius: 12px; padding: 13px; font-size: 16px; margin-bottom: 4px; outline: none;
  }
  select:focus { border-color: var(--accent); }

  .nav { display: flex; gap: 10px; margin-top: 18px; }
  .nav .btn { margin-top: 0; }
  .skip { display: block; text-align: center; color: var(--muted); font-size: 14px;
          margin-top: 12px; cursor: pointer; text-decoration: underline; }

  .done-icon {
    width: 84px; height: 84px; margin: 0 auto 16px; border-radius: 50%;
    background: rgba(38,216,60,.12); display: flex; align-items: center; justify-content: center;
    animation: pop .5s cubic-bezier(.2,.9,.3,1.4);
  }
  .done-icon svg { width: 44px; height: 44px; }
  .done-icon path {
    stroke: var(--accent); stroke-width: 6; fill: none;
    stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 60; stroke-dashoffset: 60;
    animation: draw .6s .2s ease forwards;
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .center { text-align: center; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">Nort<span>Install</span></div>
    <a class="back" href="index.html">← На главную</a>
  </header>

  <div class="progress" id="progress"></div>
  <div class="stepno" id="stepno"></div>

  <div class="card" id="card"></div>

  <div class="nav">
    <button class="btn ghost" id="prev">Назад</button>
    <button class="btn" id="next">Дальше</button>
  </div>
</div>

<script src="config.js"></script>
<script>
(function () {
  var TOTAL = 5;
  var step = Math.min(TOTAL - 1, Math.max(0, parseInt(localStorage.getItem("nort_wizard_step") || "0", 10) || 0));
  var direction = 1;
  var selectedCert = localStorage.getItem("nort_wizard_cert") || "";

  var card = document.getElementById("card");
  var prev = document.getElementById("prev");
  var next = document.getElementById("next");

  var steps = [
    {
      emoji: "🛰️",
      title: "Установите LocalDevVPN",
      body: '<p class="text">Бесплатное приложение из App Store. Оно создаёт <b>туннель к самому iPhone</b> — через него NortInstall ставит приложения без компьютера.</p>' +
            '<p class="text">После установки откройте LocalDevVPN и <b>включите VPN</b> (iOS попросит разрешить конфигурацию — разрешите).</p>',
      action: '<a class="btn" href="https://apps.apple.com/app/id6755608044" target="_blank" rel="noopener">Открыть в App Store</a>'
    },
    {
      emoji: "🛡️",
      title: "Включите DNS-профиль",
      body: '<p class="text">Профиль проекта <b>уже настроен</b> — он не даёт Apple отозвать сертификат. Ничего регистрировать не нужно.</p>' +
            '<p class="text"><ol><li>Скачайте профиль кнопкой ниже.</li><li>Настройки → <b>«Профиль загружен»</b> → Установить.</li><li>Проверка: Настройки → Основные → VPN и DNS.</li></ol></p>',
      action: '<a class="btn" href="NortInstallDNS.mobileconfig" download>Скачать DNS-профиль</a>',
      skip: "Своя подпись Apple ID — пропустить DNS"
    },
    {
      emoji: "📜",
      title: "Выберите сертификат",
      body: '<p class="text">Сертификат подписывает <b>NortInstall</b>. Выберите активный — .ipa скачается из GitHub Releases. Откройте скачанный файл, чтобы установить.</p>',
      action: "", // собирается динамически в render()
      certPicker: true
    },
    {
      emoji: "🤝",
      title: "Разрешите приложение",
      body: '<p class="text"><ol><li>Откройте NortInstall — iOS скажет «Ненадёжный разработчик».</li>' +
            '<li>Настройки → Основные → <b>VPN и управление устройствами</b>.</li>' +
            '<li>Выберите сертификат → <b>Доверять</b>.</li>' +
            '<li>Откройте NortInstall ещё раз.</li></ol></p>'
    },
    {
      emoji: "🎉",
      title: "Всё готово!",
      done: true,
      body: '<p class="text center">Откройте <b>NortInstall</b>, войдите со своим Apple ID и нажмите <b>Install SideStore</b> или <b>SideStore + LiveContainer</b>.</p>' +
            '<p class="text center">DNS-профиль после этого можно удалить: Настройки → Основные → VPN и DNS.</p>'
    }
  ];

  function render() {
    var s = steps[step];

    // прогресс
    var progress = "";
    for (var i = 0; i < TOTAL; i++) {
      progress += '<div class="seg ' + (i < step ? "done" : i === step ? "current" : "") + '"><i></i></div>';
    }
    document.getElementById("progress").innerHTML = progress;
    document.getElementById("stepno").textContent = "Шаг " + (step + 1) + " из " + TOTAL;

    // содержимое шага
    var html = "";
    if (s.done) {
      html += '<div class="done-icon"><svg viewBox="0 0 44 44"><path d="M10 23 L19 32 L34 13"/></svg></div>';
    } else {
      html += '<span class="emoji">' + s.emoji + '</span>';
    }
    html += '<h1 class="' + (s.done ? "center" : "") + '">' + s.title + "</h1>" + s.body;

    if (s.certPicker) {
      var active = NORT_CERTS.filter(function (c) { return c.status !== "revoked"; });
      if (!selectedCert && active.length) selectedCert = active[0].id;
      html += '<select id="cert">' + active.map(function (c) {
        return '<option value="' + c.id + '"' + (c.id === selectedCert ? " selected" : "") + '>' +
               "Сертификат " + c.id + " · " + c.region + " · " + c.type + "</option>";
      }).join("") + "</select>";
      html += '<a class="btn" id="certdl" href="' + NORT_RELEASES + "/NortInstall-" + selectedCert + '.ipa">Скачать NortInstall-' + selectedCert + '</a>';
      html += '<a class="skip" href="certificates.html">Все сертификаты и статусы →</a>';
    } else if (s.action) {
      html += s.action;
    }
    if (s.skip) html += '<a class="skip" id="skip">' + s.skip + "</a>";

    card.innerHTML = html;
    card.classList.remove("enter", "enter-back");
    void card.offsetWidth; // перезапуск анимации
    card.classList.add(direction > 0 ? "enter" : "enter-back");

    // динамика шага сертификата
    var select = document.getElementById("cert");
    if (select) {
      select.addEventListener("change", function () {
        selectedCert = select.value;
        localStorage.setItem("nort_wizard_cert", selectedCert);
        var dl = document.getElementById("certdl");
        dl.href = NORT_RELEASES + "/NortInstall-" + selectedCert + ".ipa";
        dl.textContent = "Скачать NortInstall-" + selectedCert;
      });
    }
    var skip = document.getElementById("skip");
    if (skip) skip.addEventListener("click", function () { go(1); });

    prev.disabled = step === 0;
    next.textContent = step === TOTAL - 1 ? "Начать заново" : "Дальше";
  }

  function go(delta) {
    if (step === TOTAL - 1 && delta > 0) {
      step = 0; // начать заново
    } else {
      step = Math.min(TOTAL - 1, Math.max(0, step + delta));
    }
    direction = delta;
    localStorage.setItem("nort_wizard_step", String(step));
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  prev.addEventListener("click", function () { go(-1); });
  next.addEventListener("click", function () { go(1); });

  render();
})();
</script>
</body>
</html>
